<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Classificador de Emails</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>📧 Classificador de Emails</h1>

        <form method="POST" action="/" enctype="multipart/form-data" class="email-form">
            <label for="email_text">Email (texto):</label>
            <textarea name="email_text" rows="6" placeholder="Cole aqui o texto do email...">{{ email_text }}</textarea>

            <label for="email_file">Ou arquivo (.txt ou .pdf):</label>
            <div class="file-upload">
                <input type="file" name="email_file" accept=".txt,.pdf">
            </div>

            <button type="submit">Classificar</button>
        </form>

        {% if category %}
        <div class="results">
            <div class="card {{ category|lower }}">
                <h2>Categoria: <span>{{ category }}</span></h2>
                <h3>Resposta sugerida:</h3>
                <p>{{ response }}</p>
            </div>
        </div>
        {% endif %}
    </div>
</body>
</html>
